<!doctype html>
<html lang="en" style="background-color: #FAF8F5;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimenture Industries — Premium Toxin-Free Nourishment & Ancient Grains</title>
    <!-- Google Fonts for Premium organic luxury look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #FAF8F5 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAF8F5;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .loader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        padding: 0 24px;
        z-index: 10;
      }
      .loader-logo {
        width: 200px;
        height: auto;
        object-fit: contain;
        animation: logoPulse 2.8s ease-in-out infinite;
        filter: drop-shadow(0 8px 24px rgba(233,30,140,0.25)) drop-shadow(0 0 30px rgba(212,175,55,0.25));
      }
      .loader-bar-bg {
        width: 240px;
        height: 3.5px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50%;
        background: linear-gradient(90deg, transparent, #E91E8C, #F39C12, #D4AF37);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(233, 30, 140, 0.6);
        animation: scannerMove 2.2s ease-in-out infinite;
      }
      .loader-title {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #E91E8C, #E67E22, #D4AF37);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: titleFade 2.5s ease-in-out infinite;
      }
      .loader-glow-bg {
        position: absolute;
        width: 450px;
        height: 450px;
        background: radial-gradient(circle, rgba(233,30,140,0.08) 0%, rgba(212,175,55,0.08) 50%, transparent 70%);
        pointer-events: none;
        filter: blur(60px);
      }
      @keyframes logoPulse {
        0%, 100% { transform: scale(0.97) translateY(-2px); }
        50% { transform: scale(1.03) translateY(2px); }
      }
      @keyframes scannerMove {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
      @keyframes titleFade {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body class="font-sans antialiased text-gray-800 bg-[#FAF8F5]" style="background-color: #FAF8F5;">

    <!-- Initial splash loader — lives OUTSIDE #root so React doesn't wipe it on mount -->
    <div id="initial-loader">
      <div class="loader-glow-bg"></div>
      <div class="loader-content">
        <img src="/logo.png" alt="Alimenture Industries" class="loader-logo" />
        <div class="loader-bar-bg">
          <div class="loader-bar-fill"></div>
        </div>
        <div class="loader-title">Alimenture Industries</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
