# Nginx site for alimenture.in — storefront + API on one VPS.
#
#   /etc/nginx/sites-available/alimenture.conf  (symlink into sites-enabled)
#   /etc/nginx/snippets/alimenture-security-headers.conf  <- deploy/nginx/security-headers.conf
#
# Layout assumed (see deploy/README.md):
#   /var/www/alimenture/frontend/current  -> symlink to the latest built dist/
#   Node API (PM2) on 127.0.0.1:3000
#
# Test + apply:  sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS (and let certbot answer its challenges)
server {
    listen 80;
    listen [::]:80;
    server_name alimenture.in www.alimenture.in;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://alimenture.in$request_uri; }
}

# www -> apex (canonical host)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.alimenture.in;

    ssl_certificate     /etc/letsencrypt/live/alimenture.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alimenture.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://alimenture.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alimenture.in;

    ssl_certificate     /etc/letsencrypt/live/alimenture.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alimenture.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/alimenture/frontend/current;
    server_tokens off;
    client_max_body_size 25m; # catalogue PDF / product image uploads

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    include /etc/nginx/snippets/alimenture-security-headers.conf;

    # Generated 301s (legacy /product/<id>, renamed slugs) — written by every build.
    include /var/www/alimenture/frontend/current/_nginx_redirects.conf;

    # ── API + realtime chat → Node ─────────────────────────────────────────────
    # The API sets its own security headers (Helmet). Declaring add_header here
    # stops the storefront headers from being inherited, so they aren't doubled.
    location /api/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── Static assets ──────────────────────────────────────────────────────────
    location /assets/ {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /images/ {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Build metadata never served.
    location ~ ^/(_redirects|_nginx_redirects\.conf)$ { return 404; }

    # ── Pages ──────────────────────────────────────────────────────────────────
    # Private, client-rendered app routes share a noindex shell.
    location ~ ^/(cart|checkout|orders|wishlist|addresses|login|register|forgot-password|reset-password)/?$ {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_app.html =404;
    }
    location ~ ^/(admin|staff)(/.*)?$ {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_app.html =404;
    }
    location = /_app.html { internal; }

    # Pre-rendered pages: /products/x -> products/x.html, / -> index.html.
    # Anything else is a real 404 (the 404 page still boots the app).
    location / {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/alimenture-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
