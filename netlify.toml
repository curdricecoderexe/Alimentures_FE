# Netlify configuration for the Alimentures storefront.

[build]
  command = "npm run build:with-sitemap"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback (also in public/_redirects; kept here for completeness)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────
# NOTE: update `connect-src` / `frame-src` if the API host or embedded services
# change. The API host is currently https://alimenture.onrender.com.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      object-src 'none';
      script-src 'self' https://checkout.razorpay.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      media-src 'self' data: blob:;
      connect-src 'self' https://alimenture.onrender.com wss://alimenture.onrender.com https://identitytoolkit.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com;
      frame-src https://checkout.razorpay.com https://api.razorpay.com https://maps.google.com https://www.google.com;
      worker-src 'self' blob:;
      upgrade-insecure-requests
    """

# Long-cache hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
